[project]
name = "straddle_bot"
authors = [
	{ name = "Straddle Bot Team", email = "admin@example.com" }
]
description = "Frappe control-plane app for the BTC ITM Straddle Bot."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
	# Frappe is installed and managed by bench.
	"fastapi>=0.110.0",
	"uvicorn>=0.29.0",
	"websockets>=12.0",
	"PyMySQL>=1.1.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
	"E501",
	"F401",
	"B904",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
